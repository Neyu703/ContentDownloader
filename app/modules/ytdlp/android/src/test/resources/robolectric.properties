# Robolectric 4.15.1 (pinned in build.gradle) does not support API 36 yet, but the module's
# compileSdk/targetSdk (set by the Expo root project) is 36. Without this, tests that don't
# explicitly pin an SDK via @Config(sdk = [...]) fail to even initialize once
# testOptions.unitTests.includeAndroidResources is enabled, since AGP then merges the real
# targetSdkVersion into the test manifest and Robolectric validates it against its own max.
sdk=35
