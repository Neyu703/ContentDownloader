name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Tag and release each new commit
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || \
             ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
            # New branch, or history was rewritten (force-push) — only the tip is safe to process.
            COMMITS="$AFTER"
          else
            COMMITS=$(git rev-list --reverse "$BEFORE..$AFTER")
          fi

          for sha in $COMMITS; do
            VERSION=$(git show "$sha:app/app.json" | jq -r '.expo.version // empty')
            if [ -z "$VERSION" ]; then
              echo "No app.json version at $sha, skipping"
              continue
            fi

            TAG="v$VERSION"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists, skipping"
              continue
            fi

            git tag "$TAG" "$sha"
            git push origin "$TAG"

            # strip the leading "[vX.Y.Z] " from the subject — the release title already shows the version
            MSG=$(git log -1 --format=%B "$sha" | sed -E '1s/^\[v[0-9]+\.[0-9]+\.[0-9]+\]\s*//')

            # X.0 (minor) commits are the real, curated releases and become "latest"; every other
            # X.Y.Z (patch) commit is a pre-release test build, never marked latest.
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ "$PATCH" = "0" ]; then
              gh release create "$TAG" --title "$TAG" --notes "$MSG" --latest
            else
              gh release create "$TAG" --title "$TAG" --notes "$MSG" --prerelease
            fi
          done
